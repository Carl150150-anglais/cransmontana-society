<!doctype html>
<!--
  Post template, 1080 x 1350. src/render.mjs fills #photo and #quote, then screenshots the page.
  Vertical positions given as "y" are the centre lines of the elements
  (label at y=72, monogram at y=1240), so the monogram stays inside the frame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root {
    --ivory: #F2EDE3;
    --gold: #C9A962;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  body { position: relative; -webkit-font-smoothing: antialiased; }

  #photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Uniform 35% black, plus a gentle darkening towards the top and bottom edges. */
  .overlay {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 24%,
        rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.5) 100%),
      rgba(0, 0, 0, 0.35);
  }

  .label {
    position: absolute; left: 0; right: 0; top: 72px;
    transform: translateY(-50%);
    text-align: center;
    font: 400 24px/1 'Jost';
    letter-spacing: 4px;
    padding-left: 4px; /* balances the trailing letter-spacing */
    color: var(--ivory);
    opacity: 0.7;
  }

  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #quote {
    max-width: 820px;
    text-align: center;
    font-family: 'Jost';
    font-weight: 300;
    font-size: 54px; /* render.mjs steps down to 48 then 44 if the quote needs a third line */
    line-height: 1.3;
    letter-spacing: 0.3px;
    color: var(--ivory);
    text-wrap: balance;
    text-shadow: 0 1px 28px rgba(0, 0, 0, 0.35);
  }

  .monogram {
    position: absolute; left: 0; right: 0; top: 1240px;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center;
    opacity: 0.85;
  }
  .monogram svg { width: 110px; height: auto; display: block; overflow: visible; }
  .monogram .cm {
    margin-top: 6px;
    font: 400 40px/1 'Bodoni Moda';
    color: var(--ivory);
  }
  .monogram .society {
    margin-top: 6px;
    font: 500 11px/1 'Jost';
    letter-spacing: 5px;
    padding-left: 5px; /* balances the trailing letter-spacing */
    color: var(--gold);
  }
</style>
</head>
<body>
  <img id="photo" alt="">
  <div class="overlay"></div>

  <div class="label">cransmontana.society</div>

  <div class="stage">
    <p id="quote">Ambition lives at altitude.</p>
  </div>

  <div class="monogram">
    <svg viewBox="0 0 230 124" aria-hidden="true">
      <path d="M6 118 L78 50 L102 72 L142 30 L224 118"
            fill="none" stroke="#C9A962" stroke-width="3" stroke-linejoin="miter" stroke-linecap="round"/>
      <!-- small four-point star above the second (higher) peak -->
      <path d="M142 3 L144.2 10.8 L152 13 L144.2 15.2 L142 23 L139.8 15.2 L132 13 L139.8 10.8 Z" fill="#C9A962"/>
    </svg>
    <div class="cm">CM</div>
    <div class="society">SOCIETY</div>
  </div>
</body>
</html>
