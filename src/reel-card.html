<!doctype html>
<!--
  Reel cards, 1080 x 1920. src/reel.mjs sets <body data-variant> and renders each one to PNG:
    title  title card: monogram, "Crans-Montana Society", "SWISS ALPS"
    end    end card: monogram, closing quote, @handle
    label  transparent overlay with the small "cransmontana.society" at the top of every clip
  The monogram uses the post values (src/template.html) multiplied by --scale.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root {
    --ivory: #F2EDE3;
    --gold: #C9A962;
    --forest: #13201A;
    --label-y: 210px; /* below the Instagram Reels header */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; background: var(--forest); -webkit-font-smoothing: antialiased; }
  body[data-variant="label"] { background: transparent; }

  /* Centre of the group at 44% of the height, like the quote on the posts. */
  .stack {
    position: absolute; left: 0; right: 0; top: 44%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  body[data-variant="title"] .stack { --scale: 2; }
  body[data-variant="end"] .stack { --scale: 1.6; }
  body[data-variant="label"] .stack,
  body[data-variant="title"] .end-only,
  body[data-variant="end"] .title-only { display: none; }

  .monogram { display: flex; flex-direction: column; align-items: center; opacity: 0.85; }
  .monogram svg { width: calc(110px * var(--scale)); height: auto; display: block; overflow: visible; }
  .monogram .cm { margin-top: calc(6px * var(--scale)); font: 400 calc(40px * var(--scale))/1 'Bodoni Moda'; color: var(--ivory); }
  .monogram .society {
    margin-top: calc(6px * var(--scale));
    font: 500 calc(11px * var(--scale))/1 'Jost';
    letter-spacing: calc(5px * var(--scale));
    padding-left: calc(5px * var(--scale)); /* balances the trailing letter-spacing */
    color: var(--gold);
  }

  .title-only { margin-top: 72px; display: flex; flex-direction: column; align-items: center; }
  .name { font: 400 66px/1.1 'Bodoni Moda'; color: var(--ivory); }
  .region {
    margin-top: 28px;
    font: 400 24px/1 'Jost';
    letter-spacing: 12px; padding-left: 12px;
    color: var(--gold);
  }

  .end-only { margin-top: 80px; display: flex; flex-direction: column; align-items: center; }
  .quote {
    max-width: 820px;
    font: 300 56px/1.3 'Jost';
    letter-spacing: 0.3px;
    color: var(--ivory);
    text-wrap: balance;
  }
  .handle {
    margin-top: 44px;
    font: 400 26px/1 'Jost';
    letter-spacing: 2px; padding-left: 2px;
    color: var(--gold);
  }

  .label {
    display: none;
    position: absolute; left: 0; right: 0; top: var(--label-y);
    transform: translateY(-50%);
    text-align: center;
    font: 400 20px/1 'Jost';
    letter-spacing: 4px; padding-left: 4px;
    color: var(--ivory);
    opacity: 0.7;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35);
  }
  body[data-variant="label"] .label { display: block; }
</style>
</head>
<body data-variant="title">
  <main class="stack">
    <div class="monogram">
      <svg viewBox="0 0 230 124" aria-hidden="true">
        <path d="M6 118 L78 50 L102 72 L142 30 L224 118"
              fill="none" stroke="#C9A962" stroke-width="3" stroke-linejoin="miter" stroke-linecap="round"/>
        <path d="M142 3 L144.2 10.8 L152 13 L144.2 15.2 L142 23 L139.8 15.2 L132 13 L139.8 10.8 Z" fill="#C9A962"/>
      </svg>
      <div class="cm">CM</div>
      <div class="society">SOCIETY</div>
    </div>
    <div class="title-only">
      <div class="name" id="name">Crans-Montana Society</div>
      <div class="region" id="region">SWISS ALPS</div>
    </div>
    <div class="end-only">
      <p class="quote" id="quote">Ambition lives at altitude.</p>
      <div class="handle" id="handle">@cransmontana.society</div>
    </div>
  </main>
  <div class="label" id="label">cransmontana.society</div>
</body>
</html>
